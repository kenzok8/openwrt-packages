# Credential-free Tower rule scheme; no subscription URL or node is bundled.
tower-summary: kenzok8个人方案，包含地区、媒体、AI 与常用服务分组
aipr: &pr {type: select, proxies: [🚀 节点选择, ♻️ 香港自动, ♻️ 日本自动, ♻️ 美国自动, ♻️ 新加坡自动, ♻️ 台湾自动, ♻️ 韩国自动, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇸🇬 新加坡节点, 🇹🇼 台湾节点, 🇰🇷 韩国节点, 🌍 全部节点, 🌐 直连]}

proxy-groups:
  - {name: 🚀 节点选择, type: select, proxies: [♻️ 香港自动, ♻️ 日本自动, ♻️ 美国自动, ♻️ 新加坡自动, ♻️ 台湾自动, ♻️ 韩国自动, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇸🇬 新加坡节点, 🇹🇼 台湾节点, 🇰🇷 韩国节点, 🌍 全部节点, 🌐 直连]}
  - {name: YouTube, icon: "https://cdn.simpleicons.org/youtube/FF0033/FF0033", <<: *pr}
  - {name: Google, icon: "https://cdn.simpleicons.org/google/4285F4/8AB4F8", <<: *pr}
  - {name: OpenAI, icon: "https://api.iconify.design/simple-icons/openai.svg?color=%2374AA9C&width=24&height=24", <<: *pr}
  - {name: Claude, icon: "https://cdn.simpleicons.org/anthropic/D97757/EAA683", <<: *pr}
  - {name: Gemini, icon: "https://cdn.simpleicons.org/googlegemini/8E75B2/BCA7E8", <<: *pr}
  - {name: Twitter, icon: "https://api.iconify.design/simple-icons/twitter.svg?color=%231DA1F2&width=24&height=24", <<: *pr}
  - {name: GitHub, icon: "https://cdn.simpleicons.org/github/24292F/FFFFFF", <<: *pr}
  - {name: Microsoft, icon: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Microsoft_icon.svg", <<: *pr}
  - {name: TikTok, icon: "https://cdn.simpleicons.org/tiktok/111111/FFFFFF", <<: *pr}
  - {name: NETFLIX, icon: "https://cdn.simpleicons.org/netflix/E50914/E50914", <<: *pr}
  - {name: PayPal, icon: "https://cdn.simpleicons.org/paypal/003087/8AB4F8", <<: *pr}
  - {name: 🍎 Apple, type: select, proxies: [🌐 直连, 🚀 节点选择]}
  - {name: 🎯 全球直连, type: select, proxies: [🌐 直连, 🚀 节点选择]}
  - {name: 🌀 列表之外, <<: *pr}
  - {name: 🇭🇰 香港节点, type: select, include-all: true, filter: "(?i)港|hk|hongkong|hong kong"}
  - {name: 🇯🇵 日本节点, type: select, include-all: true, filter: "(?i)日|jp|japan"}
  - {name: 🇺🇲 美国节点, type: select, include-all: true, filter: "(?i)美|us|unitedstates|united states"}
  - {name: 🇸🇬 新加坡节点, type: select, include-all: true, filter: "(?i)新|sg|singapore"}
  - {name: 🇹🇼 台湾节点, type: select, include-all: true, filter: "(?i)台|tw|taiwan"}
  - {name: 🇰🇷 韩国节点, type: select, include-all: true, filter: "(?i)韩|kr|korea"}
  - {name: ♻️ 香港自动, type: url-test, include-all: true, tolerance: 20, interval: 120, filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"}
  - {name: ♻️ 日本自动, type: url-test, include-all: true, tolerance: 20, interval: 120, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"}
  - {name: ♻️ 美国自动, type: url-test, include-all: true, tolerance: 20, interval: 120, filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$"}
  - {name: ♻️ 新加坡自动, type: url-test, include-all: true, tolerance: 20, interval: 120, filter: "(?=.*(新|SG|(?i)Singapore))^((?!(港|台|日|韩|美)).)*$"}
  - {name: ♻️ 台湾自动, type: url-test, include-all: true, tolerance: 20, interval: 120, filter: "(?i)台|tw|taiwan"}
  - {name: ♻️ 韩国自动, type: url-test, include-all: true, tolerance: 20, interval: 120, filter: "(?i)韩|kr|korea"}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, tolerance: 20, interval: 300}
  - {name: 🌍 全部节点, type: select, include-all: true}
  - {name: 🌐 直连, type: select, proxies: [DIRECT]}
rules:
  - RULE-SET,private_domain,🌐 直连
  - RULE-SET,direct1,🌐 直连
  - RULE-SET,apple_domain,🍎 Apple
  - RULE-SET,proxylite,🚀 节点选择
  - RULE-SET,openai_domain,OpenAI
  - RULE-SET,claude_domain,Claude
  - RULE-SET,gemini_domain,Gemini
  - RULE-SET,twitter_domain,Twitter
  - RULE-SET,github_domain,GitHub
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,Google
  - RULE-SET,tiktok_domain,TikTok
  - RULE-SET,netflix_domain,NETFLIX
  - RULE-SET,paypal_domain,PayPal
  - RULE-SET,geolocation-!cn,🚀 节点选择
  - RULE-SET,cn_domain,🎯 全球直连
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,netflix_ip,NETFLIX,no-resolve
  - RULE-SET,cn_ip,🎯 全球直连
  - MATCH,🌀 列表之外
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  kenzo: &kenzo {type: http, interval: 86400, behavior: domain, format: text}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}
