<%+header%><%local p=luci.sys.exec("grep -i '^port=' /etc/subconverter/pref.ini | cut -d '=' -f 2 | head -n 1")p=p~=""and p:gsub("[^%d]","")or"25500"%>
<style>b{display:block;margin:10px 0 5px}textarea,select,button,input:not([type=checkbox]){width:100%;box-sizing:border-box;margin-bottom:10px}#mc{padding:10px;margin-bottom:10px}#mc label{margin-right:10px}</style><div class="cbi-map cbi-section"><h2><a id=tl target=_blank>Subweb</a></h2><b>订阅链接</b><textarea id=t class=cbi-input-textarea placeholder="多订阅链接或节点请确保每行一条&#10;支持手动使用'|'分割多链接或节点" rows=5></textarea><b>客户端</b><select id=c class=cbi-input-select><option value=clash>Clash</option><option value=clashr>ClashR</option><option value=v2ray>V2Ray</option><option value=quan>Quantumult</option><option value=quanx>Quantumult X</option><option value="surge&ver=2">SurgeV2</option><option value="surge&ver=3">SurgeV3</option><option value="surge&ver=4">SurgeV4</option><option value=surfboard>Surfboard</option><option value=ss>SS (SIP002)</option><option value=sssub>SS Android</option><option value=ssd>SSD</option><option value=ssr>SSR</option><option value=loon>Loon</option><option value=singbox>Sing-box</option></select><b>后端服务</b><select id=a class=cbi-input-select onchange="ma.style.display=this.value=='m'?'block':'none'"><option id=da></option><option value=m>自定义后端 API 地址</option></select><input id=ma class=cbi-input-text placeholder="自定义后端 API 地址示例：https://sub.ops.ci" style=display:none><b>远程配置</b><select id=r class=cbi-input-select onchange="mr.style.display=this.value=='m'?'block':'none'"><option value="https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/config/ACL4SSR_Online.ini">ACL4SSR Online</option><option value=m>自定义远程配置地址</option></select><input id=mr class=cbi-input-text placeholder="自定义远程配置地址：" style=display:none><b>可选参数</b><input id=i class=cbi-input-text placeholder="Include: 可选"><input id=x class=cbi-input-text placeholder="Exclude: 可选"><button class="cbi-button cbi-button-apply" onclick="mc.style.display=mc.style.display=='none'?'block':'none'">参数</button><div id=mc class=cbi-section-node style=display:none><label><input type=checkbox id=e checked> Emoji</label> <label><input type=checkbox id=u checked> 开启UDP</label> <label><input type=checkbox id=s> 排序节点</label> <label><input type=checkbox id=sc> 关闭证书检查</label> <label><input type=checkbox id=n> Node List</label></div><input id=su class=cbi-input-text placeholder=点击转换链接 readonly><button class="cbi-button cbi-button-apply" onclick=g()>转换</button></div><script>tl.href=da.value=da.textContent=location.protocol+'//'+location.hostname+':<%=p%>';function g(){if(!t.value)return alert('请输入订阅链接或节点');let v=encodeURIComponent,A=a.value=='m'?ma.value:a.value,R=r.value=='m'?mr.value:r.value,U=A+'/sub?target='+c.value+'&url='+v(t.value.trim().replace(/\n/g,'|'));if(R)U+='&config='+v(R);if(i.value)U+='&include='+v(i.value);if(x.value)U+='&exclude='+v(x.value);U+='&emoji='+e.checked+'&udp='+u.checked+'&sort='+s.checked+'&scv='+sc.checked+'&list='+n.checked;su.value=U;su.select();try{document.execCommand('copy');alert('复制成功')}catch(E){alert('复制失败，请检查浏览器兼容性')}}</script>
<%+footer%>
